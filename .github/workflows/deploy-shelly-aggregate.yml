name: Deploy shelly-daily-aggregate

on:
  push:
    branches: [main]
    paths: ['workers/shelly-daily-aggregate/**']
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/shelly-daily-aggregate
          wranglerVersion: '4'
