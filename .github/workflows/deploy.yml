name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # /dash: lokal und online müssen denselben UI-Vertrag erfüllen, bevor deployt wird
      - name: Check /dash (lokal = online)
        run: node scripts/dash-check.mjs

      # Versions-Hash des UI-Stands → erscheint als Badge im /dash-Kopf (lokal und online identisch)
      - name: UI-Version schreiben
        run: node scripts/dash-version.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
